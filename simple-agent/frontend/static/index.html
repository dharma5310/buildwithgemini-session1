<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChefGemini — AI Culinary & Pantry Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #d84315;
    --accent-hover: #bf360c;
    --accent-light: #fbe9e7;
    --bg: #f8f6f4;
    --app-bg: #ffffff;
    --card-bg: #ffffff;
    --border: #e6dfda;
    --text-primary: #2d2422;
    --text-secondary: #756a65;
    --shadow-sm: 0 2px 8px rgba(216, 67, 21, 0.05);
    --shadow-md: 0 8px 24px rgba(216, 67, 21, 0.08);
    --msg-agent-bg: #ffffff;
    --chip-bg: #fdfbf9;
  }

  body.dark-theme {
    --accent: #ff7043;
    --accent-hover: #f4511e;
    --accent-light: #3e2723;
    --bg: #141210;
    --app-bg: #1e1b18;
    --card-bg: #272320;
    --border: #3d3531;
    --text-primary: #f5efe9;
    --text-secondary: #b3a6a0;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
    --msg-agent-bg: #272320;
    --chip-bg: #272320;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    align-items: center;
    transition: background 0.3s ease, color 0.3s ease;
  }

  /* Custom Scrollbars */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

  /* App Container */
  .app-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 900px;
    height: 100vh;
    background: var(--app-bg);
    box-shadow: var(--shadow-md);
    transition: background 0.3s ease;
  }

  /* Header */
  header {
    background: linear-gradient(135deg, #d84315 0%, #bf360c 100%);
    color: #fff;
    padding: 0.9rem 1.4rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .brand { display: flex; align-items: center; gap: 0.75rem; }
  .brand-icon { font-size: 1.7rem; line-height: 1; }
  .brand-title { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  .brand-subtitle { font-size: 0.75rem; opacity: 0.9; margin: 0; font-weight: 500; }
  
  .header-actions { display: flex; align-items: center; gap: 0.6rem; }
  .header-btn {
    background: rgba(255,255,255,0.18);
    border: none;
    color: #fff;
    padding: 0.4rem 0.7rem;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    backdrop-filter: blur(4px);
    transition: background 0.2s;
  }
  .header-btn:hover { background: rgba(255,255,255,0.28); }

  .status-badge { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; background: rgba(255,255,255,0.18); padding: 0.35rem 0.75rem; border-radius: 20px; backdrop-filter: blur(4px); }
  .status-dot { width: 8px; height: 8px; background: #4caf50; border-radius: 50%; box-shadow: 0 0 8px #4caf50; }

  /* Log / Message Stream */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    background: var(--bg);
    transition: background 0.3s ease;
  }

  /* Dialogue / Message Row */
  .msg-wrapper {
    display: flex;
    flex-direction: column;
    max-width: 88%;
    gap: 0.3rem;
  }
  .msg-wrapper.user { align-self: flex-end; }
  .msg-wrapper.agent { align-self: flex-start; }

  .msg {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    animation: fadeIn 0.25s ease-out;
  }
  .msg-wrapper.user .msg { flex-direction: row-reverse; }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }
  .msg-wrapper.user .avatar { background: var(--accent-light); color: var(--accent); }
  .msg-wrapper.agent .avatar { background: var(--card-bg); border: 1px solid var(--border); color: var(--accent); }

  .bubble {
    padding: 0.9rem 1.2rem;
    border-radius: 18px;
    font-size: 0.95rem;
    line-height: 1.5;
    box-shadow: var(--shadow-sm);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-wrapper.user .bubble {
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }
  .msg-wrapper.agent .bubble {
    background: var(--msg-agent-bg);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    max-width: 100%;
    white-space: normal;
  }

  /* Message Quick Actions Bar */
  .msg-actions {
    display: flex;
    gap: 0.4rem;
    opacity: 0;
    transition: opacity 0.2s ease;
    padding-left: 3rem;
  }
  .msg-wrapper.agent:hover .msg-actions { opacity: 1; }
  .msg-action-btn {
    background: var(--chip-bg);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 0.25rem 0.6rem;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .msg-action-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-light);
  }

  /* Animated Typing Indicator */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0.3rem 0.2rem;
  }
  .typing-indicator span {
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    display: inline-block;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1.0); }
  }

  /* Scrollable Category Prompts */
  .categories-wrapper {
    background: var(--app-bg);
    border-top: 1px solid var(--border);
    padding: 0.75rem 1.25rem 0.25rem;
  }
  .categories-title {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    margin-bottom: 0.4rem;
  }
  .categories {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding-bottom: 0.5rem;
    scroll-behavior: smooth;
  }
  .chip {
    padding: 0.45rem 0.95rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--chip-bg);
    color: var(--text-primary);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .chip:hover {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }

  /* Input Footer */
  form {
    display: flex;
    gap: 0.75rem;
    padding: 1rem 1.25rem 1.25rem;
    background: var(--app-bg);
    border-top: 1px solid var(--border);
  }
  input {
    flex: 1;
    padding: 0.85rem 1.2rem;
    border: 1.5px solid var(--border);
    border-radius: 24px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.3s;
    background: var(--chip-bg);
    color: var(--text-primary);
  }
  input:focus {
    border-color: var(--accent);
    background: var(--app-bg);
    box-shadow: 0 0 0 3px rgba(216, 67, 21, 0.15);
  }
  button[type="submit"] {
    padding: 0.85rem 1.5rem;
    border: none;
    border-radius: 24px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    box-shadow: 0 2px 10px rgba(216, 67, 21, 0.25);
  }
  button[type="submit"]:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card { border:1px solid var(--border); border-radius:14px; padding:1.2rem; background:var(--card-bg); box-shadow:var(--shadow-sm); max-width:100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top:.6rem; }
  .a2col { display:flex; flex-direction:column; gap:.5rem; }
  .a2row { display:flex; flex-direction:row; gap:.7rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.45; }
  .a2text.a2-h1 { font-size:1.5rem; font-weight:700; color: var(--text-primary); }
  .a2text.a2-h2 { font-size:1.25rem; font-weight:700; color: var(--text-primary); }
  .a2text.a2-h3 { font-size:1.1rem; font-weight:600; color: var(--text-primary); }
  .a2text.a2-h4 { font-size:1.0rem; font-weight:600; color: var(--text-primary); }
  .a2text.a2-caption { font-size:.85rem; color: var(--text-secondary); }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.5rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:12px; display:block; transition: transform 0.3s; }
  .a2img:hover { transform: scale(1.02); }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; line-height:1; vertical-align:middle; color:var(--accent); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="brand">
      <div class="brand-icon">🍳</div>
      <div>
        <h1 class="brand-title">ChefGemini</h1>
        <p class="brand-subtitle">Smart AI Culinary & Pantry Assistant</p>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="header-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌙 Theme</button>
      <button type="button" class="header-btn" onclick="clearLog()" title="Clear dialogue history">🧹 Clear</button>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>Online</span>
      </div>
    </div>
  </header>

  <div id="log"></div>

  <div class="categories-wrapper">
    <div class="categories-title">Quick Culinary Categories</div>
    <div class="categories">
      <button type="button" class="chip" onclick="sendPrompt('Find a quick 15-minute dinner recipe')">⚡ Quick Meals</button>
      <button type="button" class="chip" onclick="sendPrompt('What ingredients are currently in my pantry?')">🥕 Pantry Stock</button>
      <button type="button" class="chip" onclick="sendPrompt('Scale my recipe ingredients for 6 people')">⚖️ Scale Recipe</button>
      <button type="button" class="chip" onclick="sendPrompt('Suggest a healthy vegetarian dish')">🥗 Vegetarian</button>
      <button type="button" class="chip" onclick="sendPrompt('High protein lunch ideas')">🥩 High Protein</button>
      <button type="button" class="chip" onclick="sendPrompt('Easy dessert recipe')">🍰 Desserts</button>
    </div>
  </div>

  <form id="form">
    <input id="input" placeholder="Ask ChefGemini for recipes, pantry checks, ingredient scaling..." autocomplete="off" autofocus>
    <button type="submit">Send</button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

// Theme Toggle state
function toggleTheme() {
  document.body.classList.toggle("dark-theme");
  const isDark = document.body.classList.contains("dark-theme");
  document.getElementById("themeToggleBtn").textContent = isDark ? "☀️ Light" : "🌙 Theme";
  localStorage.setItem("chef_theme", isDark ? "dark" : "light");
}
if (localStorage.getItem("chef_theme") === "dark") {
  document.body.classList.add("dark-theme");
  document.getElementById("themeToggleBtn").textContent = "☀️ Light";
}

function clearLog() {
  log.innerHTML = "";
}

function sendPrompt(msg) {
  input.value = msg;
  form.dispatchEvent(new Event("submit", { cancelable: true }));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const wrapper = el("div", "msg-wrapper " + who);
  const m = el("div", "msg");
  const avatar = el("div", "avatar", who === "user" ? "👤" : "👨‍🍳");
  const b = el("div", "bubble");
  
  m.appendChild(avatar);
  m.appendChild(b);
  wrapper.appendChild(m);
  log.appendChild(wrapper);
  log.scrollTop = log.scrollHeight;
  return { wrapper, bubble: b };
}

function showTypingIndicator() {
  const wrapper = el("div", "msg-wrapper agent");
  wrapper.id = "typingIndicatorMsg";
  const m = el("div", "msg");
  const avatar = el("div", "avatar", "👨‍🍳");
  const b = el("div", "bubble");
  b.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
  m.appendChild(avatar);
  m.appendChild(b);
  wrapper.appendChild(m);
  log.appendChild(wrapper);
  log.scrollTop = log.scrollHeight;
}

function hideTypingIndicator() {
  const t = document.getElementById("typingIndicatorMsg");
  if (t) t.remove();
}

function addActionButtons(wrapper, textContent) {
  if (!textContent) return;
  const actions = el("div", "msg-actions");
  
  const copyBtn = el("button", "msg-action-btn", "📋 Copy");
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(textContent);
    copyBtn.textContent = "✓ Copied";
    setTimeout(() => { copyBtn.textContent = "📋 Copy"; }, 2000);
  };

  const speakBtn = el("button", "msg-action-btn", "🔊 Read");
  speakBtn.onclick = () => {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(textContent);
      window.speechSynthesis.speak(utterance);
    }
  };

  actions.appendChild(copyBtn);
  actions.appendChild(speakBtn);
  wrapper.appendChild(actions);
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column": {
      const d = el("div", "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const align = (props.alignment || "").toLowerCase();
      const d = el("div", "a2row" + (align.includes("between") ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const hint = (props.usageHint || "").toLowerCase();
      const cls = "a2text" + (hint ? " a2-" + hint : "");
      return el("p", cls, boundStr(props.text));
    }
    case "Divider": return el("hr", "a2divider");
    case "List": {
      const ul = el("ul", "a2col"); kids().forEach(n => { const li = el("li"); li.appendChild(n); ul.appendChild(li); }); return ul;
    }
    case "Image": {
      const url = boundStr(props.url);
      if (!/^https?:\/\//i.test(url)) return null;
      const img = el("img", "a2img"); img.src = url;
      const fit = props.fit || "";
      if (fit) img.style.objectFit = fit.toLowerCase();
      return img;
    }
    case "Icon": {
      const name = iconName(boundStr(props.name));
      return el("span", "material-symbols-outlined", name);
    }
    default: return null;
  }
}

function renderSurface(surface, container) {
  if (!Array.isArray(surface)) return false;
  let ok = false;
  for (const item of surface) {
    const root = item && item.surfaceUpdate && item.surfaceUpdate.components;
    if (!root || typeof root !== "object") continue;
    const node = buildNode("root", root, new Set());
    if (node) { container.appendChild(node); ok = true; }
  }
  return ok;
}

function flattenText(val) {
  if (val == null) return "";
  if (typeof val === "string") return val;
  if (Array.isArray(val)) return val.map(flattenText).filter(Boolean).join(" ");
  if (typeof val === "object") return Object.values(val).map(flattenText).filter(Boolean).join(" ");
  return "";
}

function renderReply(wrapper, b, parts) {
  b.innerHTML = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  
  // Add copy/speech action buttons for text replies
  if (textStr) {
    addActionButtons(wrapper, textStr);
  }
  
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  
  const userEntry = bubble("user");
  userEntry.bubble.textContent = text;
  input.value = "";

  showTypingIndicator();
  
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    
    hideTypingIndicator();
    const agentEntry = bubble("agent");
    renderReply(agentEntry.wrapper, agentEntry.bubble, data.parts || []);
  } catch (e) {
    hideTypingIndicator();
    const agentEntry = bubble("agent");
    agentEntry.bubble.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
